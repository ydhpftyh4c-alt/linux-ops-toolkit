name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Check Bash syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/healthcheck.sh
      - name: Real Linux diagnostic check
        if: runner.os == 'Linux'
        run: |
          set +e
          python -m opskit health --path . --json > health.json
          result=$?
          test "$result" -le 2
